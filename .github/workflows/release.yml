name: Release desktop builds

# Сборка десктопных версий под все три ОС по тегу vX.Y.Z
# и публикация артефактов в GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/numo-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: numo-linux-x64
          path: numo-linux-x64.tar.gz

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath numo-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: numo-windows-x64
          path: numo-windows-x64.zip

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent Numo.app "$GITHUB_WORKSPACE/numo-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: numo-macos
          path: numo-macos.zip

  release:
    name: Publish release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            numo-linux-x64.tar.gz
            numo-windows-x64.zip
            numo-macos.zip
          generate_release_notes: true
