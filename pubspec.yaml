name: numo
description: "Numo — контроль трат и анализ личных финансов. Все платформы, современный UI."
publish_to: 'none'
version: 1.8.0+18

environment:
  sdk: ^3.9.0

dependencies:
  archive: ^4.2.0
  crypto: ^3.0.7
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.1
  google_fonts: ^6.2.1
  http: ^1.6.0
  intl: any
  local_auth: ^3.0.1
  package_info_plus: ^9.0.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brands/

flutter_launcher_icons:
  image_path: "assets/branding/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter_native_splash:
  color: "#F4F3FA"
  color_dark: "#0E0D17"
  image: "assets/branding/splash.png"
  android_12:
    color: "#F4F3FA"
    color_dark: "#0E0D17"
    image: "assets/branding/splash.png"
